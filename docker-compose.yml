# MGMG Digital Command Center — local development stack
# Production runs on Render (render.yaml); this is for running it on a laptop.
# Usage: docker compose up -d
# Services: postgres (central store), api (webhook receiver + bots)
services:
  postgres:
    image: postgres:16-alpine
    container_name: mgmg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      # Bind to localhost only — Power BI connects over an SSH tunnel, not the open internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mgmg]


  api:
    # FastAPI service: Admin Bot, OPS Manager Bot and SAP gateway push webhooks
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mgmg-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      TZ: ${TZ:-Asia/Tashkent}
    command: uvicorn integrations.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    networks: [mgmg]

volumes:
  postgres_data:

networks:
  mgmg:
    driver: bridge

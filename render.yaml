# ============================================================================
# Render Blueprint — LOW-COST TEST DEPLOYMENT (~$2/month).
#
# This deploys just enough to test the agents end-to-end against sandbox
# accounts. What it creates:
#   mgmg-db            PostgreSQL, free plan — EXPIRES 30 DAYS after creation
#                       unless upgraded (Render deletes it, not just suspends it)
#   mgmg-api            FastAPI webhook receiver, free plan — sleeps after 15 min
#                       idle, ~30-50s cold start on the next webhook
#   mgmg-morning-agents  cron: CEO daily brief + Lead Agent + receivables alert +
#                       CRM follow-up sweep, run back to back (starter, ~$1/mo)
#                       — see scripts/run_morning_agents.py. These four used to
#                       be four separate cron services, all scheduled at the
#                       same moment purely because Render bills a ~$1/mo minimum
#                       PER SERVICE regardless of runtime — four services for a
#                       few minutes of combined work made no sense once noticed.
#   mgmg-followup-drain  cron: replay missed webhook events, hourly (starter,
#                       ~$1/mo) — kept separate on purpose: collapsing this into
#                       the once-daily job above would mean a CRM webhook event
#                       missed by the live handler waits up to 24h to get caught
#                       instead of up to 1h. That's a real behavior change, not
#                       just a cost one, so it stays on its own schedule.
#
# Cost: Render has no free tier for cron jobs at all (confirmed against
# docs.render.com/blueprint-spec) — minimum is the "starter" plan, billed
# per-minute with a ~$1/month minimum per cron service. Two cron services
# therefore run about $2/month total (was ~$5/month across five services);
# the database and web service stay on Render's genuine free plan.
#
# n8n is NOT deployed here: it needs a persistent disk, and disks require a
# paid instance on Render. None of the three agents depend on n8n — they talk
# to SAP/amoCRM/Verifix/Graph/Telegram directly — so it's safe to leave out
# until you're ready to pay for a disk. Add it back from git history
# (`git log -- render.yaml`, the n8n block from before this comment was added)
# when you upgrade.
#
# Before you fill in secrets: use sandbox/trial accounts, not MGMG's real
# SAP, amoCRM or Microsoft 365 — see the chat for where to get each for free.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# New → Blueprint and point it at the repo. Secrets marked `sync: false` are
# NOT filled in here — Render prompts for each one during setup and stores
# them in its own secret store, never in this repo.
#
# When you're ready for production: bump mgmg-db and mgmg-api off the free
# plan (`basic-256mb` / `starter`), add n8n back, and point every credential
# at MGMG's real systems.
# ============================================================================

databases:
  - name: mgmg-db
    databaseName: mgmg
    user: mgmg
    plan: free  # expires 30 days after creation — see note above
    postgresMajorVersion: 16

services:
  # ------------------------------------------------------------- api (FastAPI)
  - type: web
    name: mgmg-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Every secret now lives in exactly one place: the mgmg-shared
      # environment group, edited from Render's dashboard under
      # "Environment Groups" — not on this service directly. All 5 services
      # (this one + 4 cron jobs) read from that single group, so a value
      # filled in once is picked up everywhere.
      - fromGroup: mgmg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mgmg-db
          property: connectionString

  # n8n intentionally omitted from this free-tier blueprint — see the header
  # comment. Bring it back once you're on paid plans and want the SAP/bank/
  # CCTV workflows that live in n8n rather than in these Python agents.

  # ------------------------------- CEO brief + Lead Agent + receivables + sweep
  # Four agents that all used to be their own cron service, consolidated into
  # one because Render has no free tier for cron at all — each separate
  # service cost a ~$1/mo minimum regardless of actual runtime. They're
  # independent scripts run as separate subprocesses by
  # scripts/run_morning_agents.py, not merged code: one agent crashing can't
  # take the others down, and the wrapper's own exit code is non-zero if any
  # of them failed, so a real failure still shows up in Render's run history.
  - type: cron
    name: mgmg-morning-agents
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # cron has no free tier; billed per-minute, ~$1/mo minimum
    schedule: "0 3 * * *"  # 08:00 Asia/Tashkent
    dockerCommand: python scripts/run_morning_agents.py
    envVars:
      - fromGroup: mgmg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mgmg-db
          property: connectionString

  # ------------------------------------------- Agent 2: replay missed events
  # Kept on its own hourly schedule, NOT folded into mgmg-morning-agents above
  # — collapsing this to once-daily would mean a CRM webhook event the live
  # handler missed waits up to 24h to get caught instead of up to 1h. That's
  # a real behavior change, not just a cost one.
  - type: cron
    name: mgmg-followup-drain
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # cron has no free tier; billed per-minute, ~$1/mo minimum each
    schedule: "0 * * * *"  # hourly — the live webhook handles the common case
    dockerCommand: python agents/amocrm-followup/agent.py --drain
    envVars:
      - fromGroup: mgmg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mgmg-db
          property: connectionString

# ----------------------------------------------------------------------------
# Shared secrets for the four cron jobs. Render prompts for each `sync: false`
# value once, at blueprint creation, and reuses it across every service in
# the group — you do not re-enter SAP/amoCRM/Telegram credentials four times.
# ----------------------------------------------------------------------------
envVarGroups:
  - name: mgmg-shared
    envVars:
      - key: TZ
        value: Asia/Tashkent
      - key: ENVIRONMENT
        value: production
      - key: DRY_RUN
        value: "false"
      - key: AGENT_WRITES_ENABLED
        # Deliberately NOT a static `value:` -- a hardcoded blueprint default
        # here would get silently re-applied on the next blueprint sync,
        # wiping out a manual flip to "true" made in the dashboard. sync:
        # false makes it a one-time-entered, dashboard-owned value that a
        # blueprint sync never touches again. Defaults to Python's own
        # `False` (see Settings.agent_writes_enabled) until you set it.
        sync: false
      - key: BOTS_FROZEN
        # Same reasoning as AGENT_WRITES_ENABLED above. In this same
        # mgmg-shared group, so flipping it once in the dashboard freezes
        # mgmg-api (both bots' webhooks) AND all three cron agents' sends
        # (CEO Daily Brief, Receivables, Lead Agent) together -- they read
        # this same value on their next restart/run. Defaults to `False`
        # (see Settings.bots_frozen) until you set it.
        sync: false
      - key: SAP_BASE_URL
        sync: false
      - key: SAP_COMPANY_DB
        sync: false
      - key: SAP_USERNAME
        sync: false
      - key: SAP_PASSWORD
        sync: false
      # The SAP gateway (on its own machine, deliberately loopback-only)
      # pushes here instead of us reaching in -- one secret shared by both
      # /webhooks/sap-push/{secret} (AR aging) and
      # /webhooks/sap-gateway-push/{tool}/{secret} (orders/products/
      # customers/warehouses/inventory/payments). See
      # scripts/sap-gateway-push/ and integrations/sap/push_handler.py.
      - key: SAP_PUSH_WEBHOOK_SECRET
        sync: false
      - key: CRM_BASE_URL
        value: https://sales-crm-roan-six.vercel.app
      - key: CRM_API_KEY
        sync: false
      - key: AMOCRM_SUBDOMAIN
        sync: false
      - key: AMOCRM_DOMAIN
        value: amocrm.ru
      - key: AMOCRM_LONG_LIVED_TOKEN
        sync: false
      - key: AMOCRM_WEBHOOK_SECRET
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TEAM_OWNER_UPN
        sync: false
      - key: MS_PLANNER_GROUP_ID
        sync: false
      - key: MS_PLANNER_DEFAULT_PLAN_ID
        sync: false
      - key: TEAMS_SALES_WEBHOOK_URL
        sync: false
      # CEO Daily Brief, Receivables, and Lead Agent used to each have their
      # own dedicated bot here -- consolidated into
      # integrations/org_bot/notify.py, which sends via
      # OPS_MANAGER_BOT_TELEGRAM_BOT_TOKEN (below) to whoever currently
      # holds the Director role. Delete the old per-agent bots via
      # @BotFather; nothing reads their settings anymore.
      - key: TELEGRAM_PRIMARY_BOT_TOKEN
        sync: false  # used only by the approval-callback webhook handler
      - key: VERIFIX_MODE
        value: csv
      - key: VERIFIX_BASE_URL
        sync: false
      - key: VERIFIX_API_TOKEN
        sync: false
      - key: VERIFIX_CSV_DIR
        value: /app/data/verifix
      - key: SERPAPI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WORLDBANK_SEARCH_URL
        value: https://search.worldbank.org/api/v3/projects
      - key: ETENDER_UZEX_URL
        value: https://etender.uzex.uz/api/lots
      - key: XT_XARID_URL
        value: https://xt-xarid.uz/api/search
      - key: EGOV_OPENDATA_URL
        value: https://data.egov.uz/apiPartner/Partner
      - key: AI_PROVIDER
        value: deepseek  # "openrouter" or "deepseek" -- switching is a one-line change here
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false  # set per-environment; a ':free' model will 429 unreliably
      - key: OPENROUTER_FALLBACK_MODELS
        sync: false  # comma-separated; end the chain on cheap PAID capacity
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_FALLBACK_MODELS
        value: deepseek-v4-flash,deepseek-v4-pro
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_LEADS_SHEET_ID
        sync: false
      # Admin Bot (employee access approval) + OPS Manager Bot (AI task
      # routing) -- see docs/agent-specs/05-org-bot.md. Both are handled by
      # the always-on mgmg-api web service, not a cron job.
      - key: ADMIN_BOT_TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_BOT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_BOT_ADMIN_USER_ID
        sync: false  # optional hardening; blank/0 = disabled
      - key: OPS_MANAGER_BOT_TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPS_MANAGER_BOT_WEBHOOK_SECRET
        sync: false
      # Runs on its own provider, independent of AI_PROVIDER above (which
      # Lead Agent uses) -- confirmed working live via OpenRouterClient's
      # provider_override for both JSON-mode and plain-text calls.
      #
      # sync: false (not a static value:) for the same reason as
      # AGENT_WRITES_ENABLED above -- a hardcoded blueprint default here would
      # get silently re-applied and wipe out a manual switch (e.g. to
      # "deepseek" while OpenRouter credits are out) on every push-triggered
      # blueprint sync. Defaults shown are what to enter once in the
      # dashboard; change the dashboard value directly to switch providers,
      # never this file, or the next sync will revert it.
      - key: OPS_MANAGER_BOT_PROVIDER
        sync: false  # default: openrouter
      - key: OPS_MANAGER_BOT_MODEL
        sync: false  # default: anthropic/claude-sonnet-5
      - key: OPS_MANAGER_BOT_FALLBACK_MODELS
        sync: false  # default: google/gemini-3.7-flash

# ============================================================================
# Render Blueprint — LOW-COST DEPLOYMENT.
#
# What it creates:
#   mgmg-db              PostgreSQL. Declared on the free plan here, which Render
#                        EXPIRES 30 DAYS after creation unless its instance type
#                        is changed to a paid plan (adding a payment method to
#                        the account does not change the plan by itself).
#   mgmg-api             FastAPI webhook receiver (Admin Bot, OPS Manager Bot,
#                        SAP gateway pushes), free plan — sleeps after 15 min
#                        idle, ~30-50s cold start on the next webhook
#   mgmg-morning-agents  cron: CEO daily brief + Lead Agent + receivables alert,
#                        run back to back (starter, ~$1/mo) — see
#                        scripts/run_morning_agents.py. One service rather
#                        than three because Render bills a ~$1/mo minimum PER
#                        cron service regardless of runtime.
#
# Cost: Render has no free tier for cron jobs at all (confirmed against
# docs.render.com/blueprint-spec) — minimum is the "starter" plan, billed
# per-minute with a ~$1/month minimum per cron service, so the one cron
# service here runs about $1/month.
#
# n8n is NOT deployed here: it needs a persistent disk, and disks require a
# paid instance on Render. None of the agents depend on n8n — they talk to
# SAP, the CRM, Google Sheets and Telegram directly — so it's safe to leave
# out until you're ready to pay for a disk. Add it back from git history
# (`git log -- render.yaml`, the n8n block from before this comment was added)
# when you upgrade.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# New → Blueprint and point it at the repo. Secrets marked `sync: false` are
# NOT filled in here — Render prompts for each one during setup and stores
# them in its own secret store, never in this repo.
# ============================================================================

databases:
  - name: mgmg-db
    databaseName: mgmg
    user: mgmg
    plan: free  # expires 30 days after creation — see note above
    postgresMajorVersion: 16

services:
  # ------------------------------------------------------------- api (FastAPI)
  - type: web
    name: mgmg-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Every secret lives in exactly one place: the mgmg-shared environment
      # group, edited from Render's dashboard under "Environment Groups" — not
      # on this service directly. Both services (this one + the morning cron)
      # read from that single group, so a value filled in once is picked up
      # everywhere.
      - fromGroup: mgmg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mgmg-db
          property: connectionString

  # n8n intentionally omitted from this blueprint — see the header comment.

  # ------------------------------------ CEO brief + Lead Agent + receivables
  # Three agents that all used to be their own cron service, consolidated into
  # one because Render has no free tier for cron at all — each separate
  # service cost a ~$1/mo minimum regardless of actual runtime. They're
  # independent scripts run as separate subprocesses by
  # scripts/run_morning_agents.py, not merged code: one agent crashing can't
  # take the others down, and the wrapper's own exit code is non-zero if any
  # of them failed, so a real failure still shows up in Render's run history.
  - type: cron
    name: mgmg-morning-agents
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # cron has no free tier; billed per-minute, ~$1/mo minimum
    schedule: "0 3 * * *"  # 08:00 Asia/Tashkent
    dockerCommand: python scripts/run_morning_agents.py
    envVars:
      - fromGroup: mgmg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mgmg-db
          property: connectionString

  # --------------------------------------------- daily reports: ask + remind
  # Two services because Render gives one schedule per cron service and these
  # are an hour apart. The replies themselves cost nothing extra: employees
  # answer OPS Manager Bot, which the always-on mgmg-api already serves.
  - type: cron
    name: mgmg-daily-reports
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "5 9 * * 1-5"  # TEMPORARY for testing: 14:05 Asia/Tashkent. Production value: "0 11 * * 1-5" (16:00)
    dockerCommand: python agents/daily-reports/agent.py --ask
    envVars:
      - fromGroup: mgmg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mgmg-db
          property: connectionString

  - type: cron
    name: mgmg-report-reminder
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "15 9 * * 1-5"  # TEMPORARY for testing: 14:15 Asia/Tashkent. Production value: "0 12 * * 1-5" (17:00)
    dockerCommand: python agents/daily-reports/agent.py --remind
    envVars:
      - fromGroup: mgmg-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mgmg-db
          property: connectionString

# ----------------------------------------------------------------------------
# Shared settings for every service. Render prompts for each `sync: false`
# value once, at blueprint creation, and reuses it across every service in
# the group — you do not re-enter credentials per service.
# ----------------------------------------------------------------------------
envVarGroups:
  - name: mgmg-shared
    envVars:
      - key: TZ
        value: Asia/Tashkent
      - key: ENVIRONMENT
        value: production
      - key: DRY_RUN
        value: "false"
      - key: AGENT_WRITES_ENABLED
        # Deliberately NOT a static `value:` -- a hardcoded blueprint default
        # here would get silently re-applied on the next blueprint sync,
        # wiping out a manual flip to "true" made in the dashboard. sync:
        # false makes it a one-time-entered, dashboard-owned value that a
        # blueprint sync never touches again. Defaults to Python's own
        # `False` (see Settings.agent_writes_enabled) until you set it.
        sync: false
      - key: BOTS_FROZEN
        # Same reasoning as AGENT_WRITES_ENABLED above. In this same
        # mgmg-shared group, so flipping it once in the dashboard freezes
        # mgmg-api (both bots' webhooks) AND all three cron agents' sends
        # (CEO Daily Brief, Receivables, Lead Agent) together -- they read
        # this same value on their next restart/run. Defaults to `False`
        # (see Settings.bots_frozen) until you set it.
        sync: false
      - key: SAP_BASE_URL
        sync: false
      - key: SAP_COMPANY_DB
        sync: false
      - key: SAP_USERNAME
        sync: false
      - key: SAP_PASSWORD
        sync: false
      # The SAP gateway (on its own machine, deliberately loopback-only)
      # pushes here instead of us reaching in -- one secret shared by both
      # /webhooks/sap-push/{secret} (AR aging) and
      # /webhooks/sap-gateway-push/{tool}/{secret} (orders/products/
      # customers/warehouses/inventory/payments). See
      # scripts/sap-gateway-push/ and integrations/sap/push_handler.py.
      - key: SAP_PUSH_WEBHOOK_SECRET
        sync: false
      - key: CRM_BASE_URL
        value: https://sales-crm-roan-six.vercel.app
      - key: CRM_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: WORLDBANK_SEARCH_URL
        value: https://search.worldbank.org/api/v3/projects
      - key: ETENDER_UZEX_URL
        value: https://etender.uzex.uz/api/lots
      - key: XT_XARID_URL
        value: https://xt-xarid.uz/api/search
      - key: EGOV_OPENDATA_URL
        value: https://data.egov.uz/apiPartner/Partner
      - key: AI_PROVIDER
        value: openrouter  # "openrouter" or "deepseek" -- switching is a one-line change here
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false  # code default: google/gemini-3.8-flash; a ':free' model will 429 unreliably
      - key: OPENROUTER_FALLBACK_MODELS
        sync: false  # code default: google/gemini-3.7-flash; comma-separated, end the chain on cheap PAID capacity
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_FALLBACK_MODELS
        value: deepseek-v4-flash,deepseek-v4-pro
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_LEADS_SHEET_ID
        sync: false
      # Admin Bot (employee access approval) + OPS Manager Bot (AI task
      # routing) -- see docs/agent-specs/05-org-bot.md. Both are handled by
      # the always-on mgmg-api web service, not a cron job.
      - key: ADMIN_BOT_TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_BOT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_BOT_ADMIN_USER_ID
        sync: false  # optional hardening; blank/0 = disabled
      - key: OPS_MANAGER_BOT_TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPS_MANAGER_BOT_WEBHOOK_SECRET
        sync: false
      # Runs on its own provider, independent of AI_PROVIDER above (which
      # Lead Agent uses) -- confirmed working live via OpenRouterClient's
      # provider_override for both JSON-mode and plain-text calls.
      #
      # sync: false (not a static value:) for the same reason as
      # AGENT_WRITES_ENABLED above -- a hardcoded blueprint default here would
      # get silently re-applied and wipe out a manual switch on every
      # push-triggered blueprint sync. Defaults shown are what to enter once
      # in the dashboard; change the dashboard value directly to switch
      # providers, never this file, or the next sync will revert it.
      #
      # NOTE 2026-09-14: whatever is CURRENTLY set in the dashboard keeps
      # running regardless of the code defaults below -- sync: false means
      # this push does not change the live value. Set these three in the
      # dashboard directly (or delete them there so the code defaults apply)
      # to actually switch to OpenRouter + Gemini 3.8 Flash.
      - key: OPS_MANAGER_BOT_PROVIDER
        sync: false  # code default: openrouter (was deepseek 2026-09-05 to 2026-09-14)
      - key: OPS_MANAGER_BOT_MODEL
        sync: false  # code default: google/gemini-3.8-flash
      - key: OPS_MANAGER_BOT_FALLBACK_MODELS
        sync: false  # code default: google/gemini-3.7-flash
